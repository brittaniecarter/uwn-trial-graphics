<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utah water expertise database</title>
</head>
<body style="margin:0">
<section class="uwn-db" id="uwn-faculty-database">
  <div class="uwn-db__inner">
    <div class="uwn-db__header">
      <div>
        <h2>Utah water expertise database</h2>
        <p class="uwn-db__intro">Browse and filter public faculty expertise records by topic, institution, water challenge, and region.</p>
      </div>
      <div class="uwn-db__status" data-db-status aria-live="polite">0 experts</div>
    </div>

    <div class="uwn-db__layout">
      <aside class="uwn-db__filters" aria-label="Database filters">
        <label>
          Search records
          <input data-db-search type="search" placeholder="hydrology, policy, irrigation" autocomplete="off">
        </label>
        <label>
          Institution
          <select data-db-institution>
            <option value="">All institutions</option>
          </select>
        </label>
        <label>
          Region
          <select data-db-region>
            <option value="">All regions</option>
          </select>
        </label>
        <div>
          <div class="uwn-db__label">Water challenge</div>
          <div class="uwn-db__topic-list" data-db-topics></div>
        </div>
      </aside>

      <main class="uwn-db__main">
        <div class="uwn-db__table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Faculty</th>
                <th scope="col">Institution</th>
                <th scope="col">Primary expertise</th>
                <th scope="col">Challenges</th>
                <th scope="col">Regions</th>
              </tr>
            </thead>
            <tbody data-db-body></tbody>
          </table>
        </div>
        <section class="uwn-db__detail" data-db-detail aria-label="Selected faculty details"></section>
      </main>
    </div>
  </div>
</section>
<style>

:root {
  --uwn-db-ink: #18242d;
  --uwn-db-muted: #60707c;
  --uwn-db-line: #d8e0e5;
  --uwn-db-bg: #f4f7f8;
  --uwn-db-panel: #ffffff;
  --uwn-db-blue: #1c5d85;
  --uwn-db-blue-soft: #e7f1f7;
  --uwn-db-teal-soft: #e4f1ee;
  --uwn-db-gold-soft: #f8efdd;
}

.uwn-db {
  color: var(--uwn-db-ink);
  background: var(--uwn-db-bg);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.4;
  padding: 20px;
}

.uwn-db * {
  box-sizing: border-box;
}

.uwn-db__inner {
  max-width: 1220px;
  margin: 0 auto;
}

.uwn-db__header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: end;
  margin-bottom: 14px;
}

.uwn-db h2 {
  margin: 0 0 4px;
  font-size: clamp(1.45rem, 2vw, 2rem);
  line-height: 1.12;
  letter-spacing: 0;
}

.uwn-db__intro,
.uwn-db__status,
.uwn-db__muted {
  color: var(--uwn-db-muted);
}

.uwn-db__intro {
  margin: 0;
}

.uwn-db__status {
  padding: 9px 12px;
  border-left: 4px solid #128070;
  background: var(--uwn-db-panel);
  font-weight: 700;
}

.uwn-db__layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 14px;
}

.uwn-db__filters,
.uwn-db__table-wrap,
.uwn-db__detail {
  border: 1px solid var(--uwn-db-line);
  border-radius: 8px;
  background: var(--uwn-db-panel);
}

.uwn-db__filters {
  align-self: start;
  display: grid;
  gap: 12px;
  padding: 14px;
}

.uwn-db label {
  display: grid;
  gap: 5px;
  color: var(--uwn-db-muted);
  font-size: 0.84rem;
  font-weight: 700;
}

.uwn-db input,
.uwn-db select {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--uwn-db-line);
  border-radius: 6px;
  color: var(--uwn-db-ink);
  background: #fff;
  font: inherit;
  padding: 8px 9px;
}

.uwn-db input:focus,
.uwn-db select:focus,
.uwn-db button:focus {
  outline: 3px solid rgba(28, 93, 133, 0.2);
  outline-offset: 2px;
}

.uwn-db__topic-list {
  display: grid;
  gap: 6px;
}

.uwn-db button {
  border: 1px solid var(--uwn-db-line);
  color: var(--uwn-db-ink);
  background: var(--uwn-db-panel);
  font: inherit;
  cursor: pointer;
}

.uwn-db__topic-list button {
  min-height: 34px;
  border-radius: 6px;
  padding: 6px 8px;
  text-align: left;
  font-weight: 700;
}

.uwn-db__topic-list button[aria-pressed="true"] {
  border-color: var(--uwn-db-blue);
  color: #fff;
  background: var(--uwn-db-blue);
}

.uwn-db__main {
  display: grid;
  gap: 12px;
}

.uwn-db__table-wrap {
  overflow-x: auto;
}

.uwn-db table {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
  font-size: 0.92rem;
}

.uwn-db th,
.uwn-db td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--uwn-db-line);
  vertical-align: top;
  text-align: left;
}

.uwn-db th {
  position: sticky;
  top: 0;
  z-index: 1;
  color: var(--uwn-db-muted);
  background: #f9fbfc;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.uwn-db tr:last-child td {
  border-bottom: 0;
}

.uwn-db tr.is-selected td {
  background: var(--uwn-db-blue-soft);
}

.uwn-db__name-button {
  border: 0;
  padding: 0;
  color: var(--uwn-db-blue);
  background: transparent;
  font-weight: 700;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.uwn-db__small {
  display: block;
  color: var(--uwn-db-muted);
  font-size: 0.82rem;
  margin-top: 2px;
}

.uwn-db__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.uwn-db__chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--uwn-db-blue-soft);
  color: var(--uwn-db-ink);
  font-size: 0.76rem;
  font-weight: 700;
}

.uwn-db__chip--region {
  background: var(--uwn-db-teal-soft);
}

.uwn-db__chip--term {
  background: var(--uwn-db-gold-soft);
}

.uwn-db__detail {
  display: grid;
  gap: 12px;
  padding: 14px;
}

.uwn-db__detail h3 {
  margin: 0;
  font-size: 1.1rem;
}

.uwn-db__detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.uwn-db__field {
  display: grid;
  gap: 4px;
}

.uwn-db__label {
  color: var(--uwn-db-muted);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.uwn-db__links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.uwn-db a {
  color: var(--uwn-db-blue);
  font-weight: 700;
  text-underline-offset: 3px;
}

.uwn-db__empty {
  padding: 18px;
  color: var(--uwn-db-muted);
}

@media (max-width: 860px) {
  .uwn-db {
    padding: 14px;
  }

  .uwn-db__header,
  .uwn-db__layout,
  .uwn-db__detail-grid {
    grid-template-columns: 1fr;
  }

  .uwn-db__filters {
    position: static;
  }
}

@media (max-width: 640px) {
  .uwn-db table {
    min-width: 0;
    table-layout: fixed;
    font-size: 0.86rem;
  }

  .uwn-db th,
  .uwn-db td {
    padding: 9px 10px;
  }

  .uwn-db th:nth-child(1),
  .uwn-db td:nth-child(1) {
    width: 34%;
  }

  .uwn-db th:nth-child(2),
  .uwn-db td:nth-child(2) {
    width: 31%;
  }

  .uwn-db th:nth-child(3),
  .uwn-db td:nth-child(3) {
    width: 35%;
  }

  .uwn-db th:nth-child(4),
  .uwn-db td:nth-child(4),
  .uwn-db th:nth-child(5),
  .uwn-db td:nth-child(5) {
    display: none;
  }

  .uwn-db__name-button {
    border-radius: 0;
    background: transparent;
    appearance: none;
  }
}

</style>

<script>

(function () {
  const root = document.getElementById("uwn-faculty-database");
  if (!root) return;

  const data = window.UWN_FACULTY_DATA || [];
  const search = root.querySelector("[data-db-search]");
  const institution = root.querySelector("[data-db-institution]");
  const region = root.querySelector("[data-db-region]");
  const topics = root.querySelector("[data-db-topics]");
  const status = root.querySelector("[data-db-status]");
  const body = root.querySelector("[data-db-body]");
  const detail = root.querySelector("[data-db-detail]");
  let activeTopic = "All";
  let selectedEmail = data[0] ? data[0].email : "";

  const challengeNames = ["Water quantity and distribution", "Water quality and ecosystems", "Water use and demand", "Water infrastructure", "Water governance", "Hazards"];
  const institutions = [...new Set(data.map(item => item.university).filter(Boolean))].sort();
  const regions = [...new Set(data.flatMap(item => item.regions || []))].sort();

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character]));
  }

  function addOption(select, value) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  }

  institutions.forEach(value => addOption(institution, value));
  regions.forEach(value => addOption(region, value));

  function searchable(item) {
    return [
      item.name,
      item.email,
      item.university,
      item.department,
      item.title,
      item.waterFocus,
      item.primary,
      item.specific,
      ...(item.challenges || []),
      ...(item.regions || []),
      ...(item.terms || [])
    ].join(" ").toLowerCase();
  }

  function matches(item) {
    const query = search.value.trim().toLowerCase();
    if (query && !searchable(item).includes(query)) return false;
    if (institution.value && item.university !== institution.value) return false;
    if (region.value && !(item.regions || []).includes(region.value)) return false;
    if (activeTopic !== "All" && !(item.challenges || []).includes(activeTopic)) return false;
    return true;
  }

  function chips(values, modifier) {
    return (values || []).map(value => `<span class="uwn-db__chip${modifier ? ` ${modifier}` : ""}">${escapeHtml(value)}</span>`).join("");
  }

  function renderTopics() {
    topics.innerHTML = ["All", ...challengeNames].map(topic => {
      return `<button type="button" aria-pressed="${topic === activeTopic ? "true" : "false"}" data-topic="${escapeHtml(topic)}">${escapeHtml(topic)}</button>`;
    }).join("");
  }

  function renderDetail(item) {
    if (!item) {
      detail.innerHTML = `<div class="uwn-db__muted">Select a faculty member to view full expertise details.</div>`;
      return;
    }
    const profile = item.website ? `<a href="${escapeHtml(item.website)}" target="_blank" rel="noopener">Profile</a>` : "";
    const email = item.email ? `<a href="mailto:${escapeHtml(item.email)}">Email</a>` : "";
    detail.innerHTML = `
      <div>
        <h3>${escapeHtml(item.name)}</h3>
        <div class="uwn-db__muted">${escapeHtml([item.title, item.department, item.university].filter(Boolean).join(", "))}</div>
      </div>
      <div class="uwn-db__detail-grid">
        <div class="uwn-db__field">
          <div class="uwn-db__label">Primary expertise</div>
          <div>${escapeHtml(item.primary || "Not listed")}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Water focus</div>
          <div>${escapeHtml(item.waterFocus || "Not listed")}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Specific focus areas</div>
          <div>${escapeHtml(item.specific || "Not listed")}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Water challenges</div>
          <div class="uwn-db__chips">${chips(item.challenges, "") || "Not listed"}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Geographic focus</div>
          <div class="uwn-db__chips">${chips(item.regions, "uwn-db__chip--region") || "Not listed"}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Topics</div>
          <div class="uwn-db__chips">${chips((item.terms || []).slice(0, 8), "uwn-db__chip--term") || "Not listed"}</div>
        </div>
      </div>
      ${(profile || email) ? `<div class="uwn-db__links">${[profile, email].filter(Boolean).join("")}</div>` : ""}
    `;
  }

  function render() {
    const filtered = data.filter(matches);
    if (!filtered.some(item => item.email === selectedEmail)) {
      selectedEmail = filtered[0] ? filtered[0].email : "";
    }
    status.textContent = `${filtered.length} of ${data.length} experts`;
    body.innerHTML = filtered.length ? filtered.map(item => {
      const selected = item.email === selectedEmail;
      return `
        <tr class="${selected ? "is-selected" : ""}">
          <td>
            <button type="button" class="uwn-db__name-button" data-select="${escapeHtml(item.email)}">${escapeHtml(item.name)}</button>
            <span class="uwn-db__small">${escapeHtml(item.title || "")}</span>
          </td>
          <td>${escapeHtml(item.university || "")}<span class="uwn-db__small">${escapeHtml(item.department || "")}</span></td>
          <td>${escapeHtml(item.primary || "Not listed")}</td>
          <td><div class="uwn-db__chips">${chips(item.challenges, "")}</div></td>
          <td><div class="uwn-db__chips">${chips(item.regions, "uwn-db__chip--region")}</div></td>
        </tr>`;
    }).join("") : `<tr><td colspan="5"><div class="uwn-db__empty">No matching faculty found. Try a broader term or clear one of the filters.</div></td></tr>`;
    renderDetail(filtered.find(item => item.email === selectedEmail));
  }

  topics.addEventListener("click", event => {
    const button = event.target.closest("button[data-topic]");
    if (!button) return;
    activeTopic = button.dataset.topic;
    renderTopics();
    render();
  });

  body.addEventListener("click", event => {
    const button = event.target.closest("button[data-select]");
    if (!button) return;
    selectedEmail = button.dataset.select;
    render();
  });

  [search, institution, region].forEach(control => {
    control.addEventListener("input", render);
    control.addEventListener("change", render);
  });

  renderTopics();
  render();
}());

</script>
