<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utah water expertise database</title>
</head>
<body style="margin:0">
<main aria-label="Faculty expertise directory">
<h1 class="uwn-db__sr-only">Faculty expertise directory</h1>
<section class="uwn-db" id="uwn-faculty-database">
  <div class="uwn-db__inner">
    <section class="uwn-db__detail" id="uwn-selected-profile" data-db-detail hidden aria-label="Selected Faculty" tabindex="-1"></section>

    <div class="uwn-db__layout">
      <aside class="uwn-db__filters" aria-label="Database filters">
        <button type="button" class="uwn-db__clear" data-db-clear>Clear filters</button>
        <label>
          Search records
          <input data-db-search type="search" placeholder="hydrology, policy, irrigation" autocomplete="off">
        </label>
        <label>
          Region
          <select data-db-region>
            <option value="">All regions</option>
          </select>
        </label>
        <div>
          <div class="uwn-db__label">Water challenge</div>
          <div class="uwn-db__topic-list" data-db-topics role="group" aria-label="Water challenge filters"></div>
        </div>
      </aside>

      <section class="uwn-db__main" aria-label="Directory results">
        <div class="uwn-db__status" data-db-status aria-live="polite">0 experts</div>
        <div class="uwn-db__table-wrap">
          <table>
            <caption class="uwn-db__sr-only">Faculty water expertise. Select a name to view the full profile.</caption>
            <thead>
              <tr>
                <th scope="col">Faculty</th>
                <th scope="col">Institution</th>
                <th scope="col">Water expertise</th>
                <th scope="col">Challenges</th>
                <th scope="col">Regions</th>
              </tr>
            </thead>
            <tbody data-db-body></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</section>
<style>

:root {
  --uwn-db-ink: #18242d;
  --uwn-db-muted: #53636f;
  --uwn-db-line: #d8e0e5;
  --uwn-db-bg: #f4f7f8;
  --uwn-db-panel: #ffffff;
  --uwn-db-blue: #1c5d85;
  --uwn-db-blue-soft: #e7f1f7;
  --uwn-db-teal-soft: #e4f1ee;
  --uwn-db-gold-soft: #f8efdd;
}

.uwn-db {
  color: var(--uwn-db-ink);
  background: var(--uwn-db-bg);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.4;
  padding: 20px;
}

.uwn-db * {
  box-sizing: border-box;
}

.uwn-db__sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.uwn-db :focus-visible,
.uwn-db__detail:focus {
  outline: 3px solid #075e57;
  outline-offset: 3px;
}

.uwn-db input, .uwn-db select, .uwn-db button {
  border-color: #74818d !important;
}

.uwn-db__inner {
  max-width: 1220px;
  margin: 0 auto;
}

.uwn-db__header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: end;
  margin-bottom: 14px;
}

.uwn-db h2 {
  margin: 0 0 4px;
  font-size: clamp(1.45rem, 2vw, 2rem);
  line-height: 1.12;
  letter-spacing: 0;
}

.uwn-db__intro,
.uwn-db__status,
.uwn-db__muted {
  color: var(--uwn-db-muted);
}

.uwn-db__intro {
  margin: 0;
}

.uwn-db__status {
  padding: 9px 12px;
  border-left: 4px solid #128070;
  background: var(--uwn-db-panel);
  font-weight: 700;
}

.uwn-db__layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 14px;
}

.uwn-db__filters,
.uwn-db__table-wrap,
.uwn-db__detail {
  border: 1px solid var(--uwn-db-line);
  border-radius: 8px;
  background: var(--uwn-db-panel);
}

.uwn-db__filters {
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  align-self: start;
  display: grid;
  gap: 12px;
  padding: 14px;
}

.uwn-db label {
  display: grid;
  gap: 5px;
  color: var(--uwn-db-muted);
  font-size: 0.84rem;
  font-weight: 700;
}

.uwn-db input,
.uwn-db select {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--uwn-db-line);
  border-radius: 6px;
  color: var(--uwn-db-ink);
  background: #fff;
  font: inherit;
  padding: 8px 9px;
}

.uwn-db input:focus,
.uwn-db select:focus,
.uwn-db button:focus {
  outline: 3px solid #075e57;
  outline-offset: 2px;
}

.uwn-db__topic-list {
  display: grid;
  gap: 6px;
}

.uwn-db button {
  border: 1px solid var(--uwn-db-line);
  color: var(--uwn-db-ink);
  background: var(--uwn-db-panel);
  font: inherit;
  cursor: pointer;
}

.uwn-db__topic-list button {
  min-height: 34px;
  border-radius: 6px;
  padding: 6px 8px;
  text-align: left;
  font-weight: 700;
}

.uwn-db__topic-list button[aria-pressed="true"] {
  border-color: var(--uwn-db-blue);
  color: #fff;
  background: var(--uwn-db-blue);
}

.uwn-db__main {
  display: grid;
  gap: 12px;
}

.uwn-db__table-wrap {
  overflow-x: auto;
}

.uwn-db table {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
  font-size: 0.92rem;
}

.uwn-db th,
.uwn-db td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--uwn-db-line);
  vertical-align: top;
  text-align: left;
}

.uwn-db th {
  position: sticky;
  top: 0;
  z-index: 1;
  color: var(--uwn-db-muted);
  background: #f9fbfc;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.uwn-db tr:last-child td {
  border-bottom: 0;
}

.uwn-db tr.is-selected td {
  background: var(--uwn-db-blue-soft);
}

.uwn-db__name-button {
  border: 0;
  padding: 0;
  color: var(--uwn-db-blue);
  background: transparent;
  font-weight: 700;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.uwn-db__small {
  display: block;
  color: var(--uwn-db-muted);
  font-size: 0.82rem;
  margin-top: 2px;
}

.uwn-db__chips {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 5px;
}

.uwn-db__chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--uwn-db-blue-soft);
  color: var(--uwn-db-ink);
  font-size: 0.76rem;
  font-weight: 700;
}

.uwn-db__chip--region {
  background: var(--uwn-db-teal-soft);
}

.uwn-db__chip--term {
  background: var(--uwn-db-gold-soft);
}

.uwn-db__detail {
  display: grid;
  gap: 12px;
  padding: 22px;
  margin-bottom: 20px;
  background: #eaf4f4;
  border: 1px solid #a8cecc;
  border-top: 5px solid #0d766d;
  box-shadow: 0 4px 14px rgba(15, 65, 70, 0.10);
  scroll-margin-top: 12px;
}

.uwn-db__detail[hidden] {
  display: none;
}

.uwn-db__detail .uwn-db__chip,
.uwn-db__table-wrap .uwn-db__chip {
  background: #c7dfef;
  border: 1px solid #42799b;
  color: #153d56;
  padding: 5px 10px;
}

.uwn-db__detail .uwn-db__chip--region,
.uwn-db__table-wrap .uwn-db__chip--region {
  background: #bce0d4;
  border-color: #367d68;
  color: #154b3b;
}

.uwn-db__selected-label {
  color: #075e57;
  font-size: .78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.uwn-db__clear {
  padding: 9px 12px;
  border-radius: 6px;
  font-weight: 700 !important;
}

.uwn-db__list {
  margin: 0;
  padding-left: 18px;
}

.uwn-db__list li + li {
  margin-top: 4px;
}

.uwn-db__detail h2 {
  margin: 0;
  font-size: 1.5rem;
}

.uwn-db__detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.uwn-db__field {
  align-content: start;
  display: grid;
  gap: 4px;
}

.uwn-db__detail-side {
  display: grid;
  align-content: start;
  gap: 16px;
}

.uwn-db__label {
  color: var(--uwn-db-muted);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.uwn-db__links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.uwn-db a {
  overflow-wrap: anywhere;
  min-width: 0;
  color: var(--uwn-db-blue);
  font-weight: 700;
  text-underline-offset: 3px;
}

.uwn-db__empty {
  padding: 18px;
  color: var(--uwn-db-muted);
}

@media (max-width: 860px) {
  .uwn-db {
    padding: 14px;
  }

  .uwn-db__header,
  .uwn-db__layout,
  .uwn-db__detail-grid {
    grid-template-columns: 1fr;
  }

  .uwn-db__filters {
    position: static;
    max-height: none;
    overflow-y: visible;
  }
}

@media (max-width: 640px) {
  .uwn-db table {
    min-width: 0;
    table-layout: fixed;
    font-size: 0.86rem;
  }

  .uwn-db th,
  .uwn-db td {
    padding: 9px 10px;
  }

  .uwn-db th:nth-child(1),
  .uwn-db td:nth-child(1) {
    width: 34%;
  }

  .uwn-db th:nth-child(2),
  .uwn-db td:nth-child(2) {
    width: 31%;
  }

  .uwn-db th:nth-child(3),
  .uwn-db td:nth-child(3) {
    width: 35%;
  }

  .uwn-db th:nth-child(4),
  .uwn-db td:nth-child(4),
  .uwn-db th:nth-child(5),
  .uwn-db td:nth-child(5) {
    display: none;
  }

  .uwn-db__name-button {
    border-radius: 0;
    background: transparent;
    appearance: none;
  }
}

</style>

hallenges": ["Water quality and ecosystems", "Water quantity and distribution"], "regions": ["Northern Utah", "Wasatch Front"]}, {"name": "Wei Zhang", "lastName": "Zhang", "email": "w.zhang@usu.edu", "university": "Utah State University", "department": "Plants, Soils & Climate", "title": "Associate Professor", "website": "https://scholar.google.com/citations?hl=en&user=qnAR1zcAAAAJ&view_op=list_works&sortby=pubdate", "specific": "• Hydroclimate • Water prediction & budgets • Droughts/floods • Modeling", "specificItems": ["Hydroclimate", "Water prediction & budgets", "Droughts/floods", "Modeling"], "challenges": ["Hazards", "Water quantity and distribution"], "regions": ["Colorado River Basin", "Great Salt Lake Basin"]}];
</script>
<script>

(function () {
  const root = document.getElementById("uwn-faculty-database");
  if (!root) return;

  const data = window.UWN_FACULTY_DATA || [];
  const search = root.querySelector("[data-db-search]");
  const region = root.querySelector("[data-db-region]");
  const topics = root.querySelector("[data-db-topics]");
  const status = root.querySelector("[data-db-status]");
  const body = root.querySelector("[data-db-body]");
  const detail = root.querySelector("[data-db-detail]");
  let activeTopic = "All";
  let selectedEmail = "";

  const challengeNames = ["Water quantity and distribution", "Water quality and ecosystems", "Water use and demand", "Water infrastructure", "Water governance", "Hazards"];
  const regions = [...new Set(data.flatMap(item => item.regions || []))].sort();

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character]));
  }

  function addOption(select, value) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  }

  regions.forEach(value => addOption(region, value));

  function searchable(item) {
    return [
      item.name,
      item.email,
      item.university,
      item.department,
      item.title,
      item.specific,
      ...(item.challenges || []),
      ...(item.regions || [])
    ].join(" ").toLowerCase();
  }

  function matches(item) {
    const query = search.value.trim().toLowerCase();
    if (query && !searchable(item).includes(query)) return false;
    if (region.value && !(item.regions || []).includes(region.value)) return false;
    if (activeTopic !== "All" && !(item.challenges || []).includes(activeTopic)) return false;
    return true;
  }

  function chips(values, modifier) {
    return (values || []).map(value => `<span class="uwn-db__chip${modifier ? ` ${modifier}` : ""}">${escapeHtml(value)}</span>`).join("");
  }

  function listItems(values) {
    const items = (values || []).filter(Boolean);
    if (!items.length) return "Not listed";
    return `<ul class="uwn-db__list">${items.map(value => `<li>${escapeHtml(value)}</li>`).join("")}</ul>`;
  }

  function renderTopics() {
    if (topics.children.length) {
      topics.querySelectorAll("button[data-topic]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.topic === activeTopic));
      });
      return;
    }
    topics.innerHTML = ["All", ...challengeNames].map(topic => {
      return `<button type="button" aria-pressed="${topic === activeTopic ? "true" : "false"}" data-topic="${escapeHtml(topic)}">${escapeHtml(topic)}</button>`;
    }).join("");
  }

  function renderDetail(item) {
    detail.hidden = !item;
    if (!item) {
      detail.innerHTML = "";
      return;
    }
    const profile = item.website ? `<a href="${escapeHtml(item.website)}" target="_blank" rel="noopener" aria-label="Website for ${escapeHtml(item.name)} (opens in a new tab)">Website <span aria-hidden="true">↗</span></a>` : "";
    const email = item.email ? `<a href="mailto:${escapeHtml(item.email)}">${escapeHtml(item.email)}</a>` : "";
    detail.innerHTML = `
      <div class="uwn-db__selected-label">Selected Faculty</div>
      <div>
        <h2 id="uwn-selected-name">${escapeHtml(item.name)}</h2>
        <div class="uwn-db__muted">${escapeHtml([item.title, item.department].filter(Boolean).join(", "))}</div>
        ${item.university ? `<div class="uwn-db__university">${escapeHtml(item.university)}</div>` : ""}
      </div>
      <div class="uwn-db__detail-grid">
        <div class="uwn-db__field">
          <div class="uwn-db__label">Water expertise</div>
          <div>${listItems(item.specificItems || (item.specific ? [item.specific] : []))}</div>
        </div>
        <div class="uwn-db__detail-side">
        <div class="uwn-db__field">
          <div class="uwn-db__label">Water challenge areas</div>
          <div class="uwn-db__chips">${chips(item.challenges, "") || "Not listed"}</div>
        </div>
        <div class="uwn-db__field">
          <div class="uwn-db__label">Utah regions</div>
          <div class="uwn-db__chips">${chips(item.regions, "uwn-db__chip--region") || "Not listed"}</div>
        </div>
        </div>
      </div>
      ${(profile || email) ? `<div class="uwn-db__links">${[profile, email].filter(Boolean).join("")}</div>` : ""}
    `;
  }

  function render() {
    const filtered = data.filter(matches);
    if (!filtered.some(item => item.email === selectedEmail)) {
      selectedEmail = "";
    }
    status.textContent = `${filtered.length} of ${data.length} experts`;
    body.innerHTML = filtered.length ? filtered.map(item => {
      const selected = item.email === selectedEmail;
      return `
        <tr class="${selected ? "is-selected" : ""}">
          <td>
            <button type="button" class="uwn-db__name-button" data-select="${escapeHtml(item.email)}" aria-controls="uwn-selected-profile" aria-expanded="${selected}">${escapeHtml(item.name)}</button>
            <span class="uwn-db__small">${escapeHtml(item.title || "")}</span>
          </td>
          <td>${escapeHtml(item.university || "")}<span class="uwn-db__small">${escapeHtml(item.department || "")}</span></td>
          <td>${listItems(item.specificItems || [])}</td>
          <td><div class="uwn-db__chips">${chips(item.challenges, "")}</div></td>
          <td><div class="uwn-db__chips">${chips(item.regions, "uwn-db__chip--region")}</div></td>
        </tr>`;
    }).join("") : `<tr><td colspan="5"><div class="uwn-db__empty">No matching faculty found. Try a broader term or clear one of the filters.</div></td></tr>`;
    renderDetail(filtered.find(item => item.email === selectedEmail));
  }

  root.querySelector("[data-db-clear]").addEventListener("click", () => {
    selectedEmail = "";
    search.value = "";
    region.value = "";
    activeTopic = "All";
    renderTopics();
    render();
  });

  topics.addEventListener("click", event => {
    const button = event.target.closest("button[data-topic]");
    if (!button) return;
    activeTopic = button.dataset.topic;
    renderTopics();
    render();
  });

  body.addEventListener("click", event => {
    const button = event.target.closest("button[data-select]");
    if (!button) return;
    selectedEmail = button.dataset.select;
    render();
    detail.focus({ preventScroll: true });
    detail.scrollIntoView({ block: "start", behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? "instant" : "smooth" });
  });

  [search, region].forEach(control => {
    control.addEventListener("input", render);
    control.addEventListener("change", render);
  });

  renderTopics();
  render();
}());

</script>

</main>
