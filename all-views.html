 links.forEach(o=>{const on=type==="b"?o.i===id:o.k===id;o.l.classList.toggle("on",on);o.l.classList.toggle("dim",!on)});ORDER.forEach(k=>he[k].classList.toggle("dim",!ak.has(k)));bn.forEach(p=>be[p.idx].classList.toggle("dim",!bk.has(p.idx)))}

marks.push((a,b,i)=>{ORDER.forEach(k=>he[k].classList.toggle("sel",k===a&&!b));bn.forEach(p=>be[p.idx].classList.toggle("sel",p.idx===i))})})();

/* ---------- SHARED PANEL ---------- */
const list=(h,a)=>`<h3>${h}</h3>`+(a.length?`<ul class="l">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="note">None listed in the dominant themes yet.</p>`);
const mk=(a,b,i)=>marks.forEach(f=>f(a,b,i));
function selArea(a){mk(a,null,null);const ls=ORDER.filter(b=>b!==a&&pair[a][b].length).sort((x,y)=>pair[a][y].length-pair[a][x].length);
 panel.innerHTML=`<h2>${sw(a)}${AREAS[a].n}</h2><p class="sub">Dominant themes from the workshop summary</p>`+list("Drivers",AREAS[a].D)+list("Problems",AREAS[a].P)+list("Management actions",AREAS[a].A)+list("Goals",AREAS[a].G)+
 `<h3>Connections to other areas</h3><div class="chips">${ls.map(b=>`<button class="chip" data-b="${b}">${sw(b)}${AREAS[b].n} (${pair[a][b].length})</button>`).join("")}</div>`;
 panel.querySelectorAll(".chip").forEach(c=>c.onclick=()=>selPair(a,c.dataset.b))}
function selPair(a,b){mk(a,b,null);const ids=pair[a][b];
 panel.innerHTML=`<h2>${sw(a)}${sw(b)}${ids.length} shared theme${ids.length===1?"":"s"}</h2><p class="sub">${AREAS[a].n} and ${AREAS[b].n}</p><dl>${ids.map(i=>`<dt>${BRIDGES[i][0]}</dt><dd>${BRIDGES[i][2]}</dd>`).join("")}</dl>
 <h3>Open an area</h3><div class="chips"><button class="chip" data-a="${a}">${sw(a)}${AREAS[a].n}</button><button class="chip" data-a="${b}">${sw(b)}${AREAS[b].n}</button></div>`;
 panel.querySelectorAll(".chip").forEach(c=>c.onclick=()=>selArea(c.dataset.a))}
function selBridge(i){mk(null,null,i);const b=BRIDGES[i];
 panel.innerHTML=`<h2>${b[0]}</h2><p class="sub">Connects ${b[1].length} of the 6 areas</p><p>${b[2]}</p><h3>Appears in</h3><div class="chips">${b[1].map(k=>`<button class="chip" data-a="${k}">${sw(k)}${AREAS[k].n}</button>`).join("")}</div>`;
 panel.querySelectorAll(".chip").forEach(c=>c.onclick=()=>selArea(c.dataset.a))}
function home(){mk(null,null,null);panel.innerHTML=`<h2>Start anywhere</h2><p class="sub">Proof of concept</p><p>All three views show the same six challenge areas and the themes they share. Switch views with the buttons above the graphic.</p><p>Climate change, drought, flooding and agriculture each touch four areas. Quality &amp; Ecosystems and Hazards share the most themes (seven).</p><p class="note">Connections were tagged by hand from the dominant-themes sheet and are a draft for the team to review.</p>`}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));document.querySelectorAll("svg").forEach(s=>s.classList.toggle("on",s.id===t.dataset.v));document.getElementById("desc").textContent=DESC[t.dataset.v]});
document.getElementById("desc").textContent=DESC.chord;home();
</script>
</body>
